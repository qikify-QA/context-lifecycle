name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo:
    name: contracts, config, skills, scripts
    runs-on: ubuntu-latest
    steps:
      # Security checks need every tracked path, including historical run artifacts at HEAD.
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Script chỉ dùng thư viện chuẩn của Node — không cần npm ci.
      - name: Contracts, schemas, templates, config, appendix, skills
        run: node scripts/ctx/validate-contracts.mjs
      - name: Deterministic script tests
        run: npm test
      - name: Block new credentials across all tracked paths (including runs)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            node scripts/ctx/secret-scan.mjs --base "$base"
          else
            node scripts/ctx/secret-scan.mjs
          fi

  knowledge:
    name: knowledge package (báo cáo)
    runs-on: ubuntu-latest
    # qa-knowledge là repo private: cần secret QA_KNOWLEDGE_READ_TOKEN (fine-grained, read-only).
    # Chưa có secret thì job này bỏ qua.
    if: ${{ vars.CHECK_KNOWLEDGE == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/runs/context/
      - name: Checkout submodule knowledge
        run: |
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ secrets.QA_KNOWLEDGE_READ_TOKEN }}' | base64 -w0)" \
            submodule update --init --depth 1 knowledge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Nợ dữ liệu đã biết (DECISIONS mục 6) làm hai bước này đỏ — chỉ báo cáo cho tới khi trả nợ.
      - name: Audit zero-run-reference trên knowledge/
        continue-on-error: true
        run: node scripts/ctx/audit-preview.mjs --dir knowledge/products
      - name: Manifest check
        continue-on-error: true
        run: node scripts/generate-manifest.mjs --check
