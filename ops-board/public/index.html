<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Agent Board</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="board-page">
      <div class="board-sticky">
        <header class="page-header">
          <div>
            <h1>Agent Board</h1>
            <p id="refreshStatus">Ready</p>
          </div>
          <div class="toolbar-actions">
            <button id="healthToggle" type="button" class="toggle-btn" aria-pressed="false">Context health</button>
            <button id="autoRefreshToggle" type="button" class="toggle-btn" aria-pressed="false">Auto-refresh: Off</button>
            <button id="refreshBoard" type="button" class="icon-btn" title="Refresh" aria-label="Refresh">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                <path d="M21 3v6h-6" />
              </svg>
            </button>
          </div>
        </header>
        <div class="board-header" id="boardHeader" aria-hidden="true"></div>
      </div>
      <section class="board" id="board" aria-label="Agent task board"></section>
      <section class="health" id="health" aria-label="Context health" hidden></section>
    </main>

    <dialog id="agentDialog">
      <form method="dialog" class="dialog task-dialog">
        <header>
          <div>
            <p id="dialogType" class="eyebrow"></p>
            <h2 id="dialogTitle"></h2>
          </div>
          <button value="close" aria-label="Close">×</button>
        </header>
        <div>
          <h3>Results</h3>
          <div id="dialogResults" class="detail-text results-text"></div>
        </div>
        <section class="activity-section">
          <div class="activity-head">
            <h3>Activity</h3>
            <span id="activityCount"></span>
          </div>
          <div id="activityList" class="activity-list"></div>
        </section>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
